<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="TRIPPERS COFFEE">
  <defs>
    <linearGradient id="beanFill" x1="0" y1="0" x2="0.9" y2="1">
