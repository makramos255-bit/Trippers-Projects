      <stop offset=".38" stop-color="#C46A29"/>
      <stop offset=".72" stop-color="#964212"/>
      <stop offset="1" stop-color="#6E2C08"/>
    </linearGradient>
    <linearGradient id="beanFill2" x1="0.1" y1="0" x2="0.85" y2="1">
